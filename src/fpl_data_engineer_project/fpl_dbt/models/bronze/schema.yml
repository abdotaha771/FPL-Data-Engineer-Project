version: 2

models:
  - name: bronze_matches
    columns:
      - name: season_id
        tests:
          - not_null
      - name: match_id
        tests:
          - not_null
          - unique
      

  - name: bronze_playermatchstats
    columns:
      - name: player_id
        tests:
          - not_null
      - name: match_id
        tests:
          - not_null
      - name: season_id
        tests:
          - not_null
      

  - name: bronze_players
    columns:
      - name: player_id
        tests:
          - not_null
      - name: season_id
        tests:
          - not_null
      


  - name: bronze_teams
    columns:
      - name: code
        tests:
          - not_null
      - name: season_id
        tests:
          - not_null
      
