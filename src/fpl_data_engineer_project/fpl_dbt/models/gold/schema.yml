version: 2

models:
  - name: dim_season
    columns:
      - name: season_key
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: dim_team
    columns:
      - name: team_key
        tests:
          - not_null
          - unique
      - name: season_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key

  - name: dim_player
    columns:
      - name: player_key
        tests:
          - not_null
          - unique
      - name: team_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: season_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key

  - name: fact_match
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: season_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: home_team_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team_home')
                field: team_key
      - name: away_team_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team_away')
                field: team_key

  - name: fact_team_match
    columns:
      - name: team_match_key
        tests:
          - not_null
          - unique
      - name: season_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: team_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: opponent_team_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key

  - name: fact_player_match
    columns:
      - name: player_match_key
        tests:
          - not_null
          - unique
      - name: season_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: player_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: team_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
